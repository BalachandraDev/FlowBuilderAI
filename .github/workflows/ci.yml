name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web app (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  demo:
    name: Browser demo (build, real-browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:demo
      # the same site GitHub Pages serves, under /FlowBuilderAI/, driven by the Chrome that is installed on the runner
      - run: npx playwright test -c playwright.demo.config.ts

  server:
    name: Server (build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      # the web app is built by the job above and by the Docker image, so it is skipped here
      - run: dotnet build src/FlowCapture.Api/FlowCapture.Api.csproj -c Release -p:SkipWebBuild=true
      - run: dotnet test tests/FlowCapture.UnitTests/FlowCapture.UnitTests.csproj -c Release
