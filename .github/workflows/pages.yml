name: Project site

# Publishes the folder "site" (a static project page) to GitHub Pages.
# One-time setup in the repository: Settings > Pages > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # the live demo: the web app with a demo backend inside the page, built into site/app (the site is the project page plus the demo)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the browser demo
        working-directory: web
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/app/
        run: |
          npm ci --no-audit --no-fund
          npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # the list of a run's artifacts can lag a moment behind the upload; deploying at once then finds "0 artifacts"
      - name: Let the uploaded artifact become visible
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
